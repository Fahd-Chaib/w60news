# ─────────────────────────────────────────────────────────────
#  World in 60 — configuration
#  Secrets (API keys, tokens) go in GitHub Secrets / .env, NOT here.
# ─────────────────────────────────────────────────────────────

channel:
  name: "World in 60"
  handle: "@w60news"
  language: "en"
  tagline: "The world's biggest stories, explained in 60 seconds"
  ai_label: "AI-assisted · cross-checked with multiple outlets"

# ── Publishing rhythm ────────────────────────────────────────
# GitHub Actions runs the bot every 30 min. Each run publishes ONLY
# the stories that pass the "juicy" bar — could be 0, could be 3.
selection:
  lookback_hours: 8               # news window analysed on each run
  min_score: 72                   # 0-100: below this, the story is skipped
  min_sources: 2                  # cross-check: at least N different outlets
  max_videos_per_run: 2
  max_videos_per_day: 14          # safety cap (TikTok caps ~15/day/account)
  dedup_hours: 48                 # never redo a story covered in the last 48 h
  quiet_hours: null               # global audience → post around the clock. e.g. [2, 6] (UTC)

# ── Video formats ────────────────────────────────────────────
# mixed      = (default) every line of Sam & Nina's dialogue gets its own shot:
#              desk, photo, stat, key points, "according to…", versus, timeline, audience question
# characters = desk only · motion = photos + voice-over · slides = infographic only
formats:
  mode: "mixed"                   # mixed | auto (LLM picks one single style) | rotation
  rotation: [characters, motion, slides]
  target_seconds: 52              # 45-60 s

characters:
  a: { name: "Sam",  role: "anchor", voice: "en-US-AndrewNeural" }   # American male
  b: { name: "Nina", role: "anchor", voice: "en-GB-SoniaNeural" }    # British female

narrator_voice: "en-GB-SoniaNeural"   # voice-over for motion/slides (Nina)
tts_rate: "+6%"

theme:
  primary: "#E63946"              # "breaking" red
  dark: "#0B1320"
  light: "#F6F4EF"
  accent: "#FFD166"

intro:
  enabled: true                   # branded opening on every short: an anchor says the line below
  text: "Welcome to World in 60!" # spoken by Sam or Nina (alternates from one story to the next)
  logo: "60"                      # big number in the red badge
  logo_sub: "WORLD IN 60"         # white pill under the badge

music:
  enabled: true                   # original jingle generated by the bot (no copyright)
  volume: 0.12

# ── Daily long recap on YouTube (16:9) ───────────────────────
recap:
  enabled: true
  min_stories: 4
  max_stories: 12

# ── Free open-source LLM ─────────────────────────────────────
# gpt-oss-120b (open weights, Apache 2.0) on free inference APIs.
# Providers are tried in order; if one is rate-limited, the next takes over.
llm:
  providers:
    - name: groq
      base_url: "https://api.groq.com/openai/v1"
      model: "openai/gpt-oss-120b"
      key_env: "GROQ_API_KEY"
    - name: cerebras
      base_url: "https://api.cerebras.ai/v1"
      model: "gpt-oss-120b"
      key_env: "CEREBRAS_API_KEY"
  reasoning_effort: "low"         # saves tokens on the free tier

# ── RSS sources (international, English) ─────────────────────
# Add or remove freely. Dead feeds are skipped without crashing.
sources:
  - { name: "BBC World",       url: "https://feeds.bbci.co.uk/news/world/rss.xml" }
  - { name: "BBC Business",    url: "https://feeds.bbci.co.uk/news/business/rss.xml" }
  - { name: "BBC Tech",        url: "https://feeds.bbci.co.uk/news/technology/rss.xml" }
  - { name: "Al Jazeera",      url: "https://www.aljazeera.com/xml/rss/all.xml" }
  - { name: "The Guardian",    url: "https://www.theguardian.com/world/rss" }
  - { name: "NYT World",       url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml" }
  - { name: "France 24",       url: "https://www.france24.com/en/rss" }
  - { name: "DW",              url: "https://rss.dw.com/rdf/rss-en-world" }
  - { name: "NPR",             url: "https://feeds.npr.org/1004/rss.xml" }
  - { name: "Sky News",        url: "https://feeds.skynews.com/feeds/rss/world.xml" }
  - { name: "RFI",             url: "https://www.rfi.fr/en/rss" }
  - { name: "Euronews",        url: "https://www.euronews.com/rss?level=theme&name=news" }
  - { name: "CNBC World",      url: "https://www.cnbc.com/id/100727362/device/rss/rss.html" }
  - { name: "The Verge",       url: "https://www.theverge.com/rss/index.xml" }

# ── Platforms ────────────────────────────────────────────────
platforms:
  youtube:
    enabled: true
    privacy: "public"             # public | unlisted | private
    category_id: "25"             # News & Politics
    upload_recap: true
  instagram:
    enabled: true
    graph_host: "graph.instagram.com"   # graph.facebook.com if you go through a Facebook Page
    api_version: "v25.0"
  tiktok:
    enabled: true
    # Until your TikTok app passes TikTok's audit, TikTok forces SELF_ONLY (private).
    privacy: "PUBLIC_TO_EVERYONE"

dry_run: false                    # true = produce everything, publish nothing
